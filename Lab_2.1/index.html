<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная 2.1</title>
</head>

<body>
    <h1>Получение имени пользователя:</h1>
    <script>
        "use strict";
        let userName = prompt("Введите ваше имя: ");
        if (!userName) {
            userName = "Незнакомец";
        }
        console.log(`Привет, ${userName}!`);
        document.write(`Привет, ${userName}!`);
    </script>
</body>

</html>
