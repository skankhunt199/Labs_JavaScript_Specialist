<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная 2.3</title>
</head>

<body>
    <h1>Динамическая таблица</h1>
    <script>
        "use strict";

        let rowsCount = parseInt(prompt("Введите количество строк:"));
        let colsCount = parseInt(prompt("Введите количество столбцов:"));
3
        if (isNaN(rowsCount) || isNaN(colsCount)) {
            document.write("Вы ввели не число!");
        } else {
            document.write("<table border='1'>");
            for (let i = 1; i <= rowsCount; i++) {
                let styleRow = i == 1 ? " style='background-color: red;'" : "";
                document.write(`<tr${styleRow}>`);                    
                for (let j = 1; j <= colsCount; j++) {
                    let styleCol = j == 1 ? " style='background-color: red;'" : "";
                    document.write(`<td${styleCol}>${i * j}</td>`);
                }
                document.write("</tr>");
            }
            document.write("</table>");
        }        
    </script>
</body>

</html>
