<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабраторная 2.2</title>
</head>

<body>
    <h1>Колличество ворон на ветке:</h1>
    <script>
        "use strict";

        let crowsCount = parseInt(prompt("Введите колличество ворон на ветке:"));

        let result = "";

        if (isNaN(crowsCount)) {
            result = "Вы ввели не число!";
        }
        else {
            let firstPartMessage = "На ветке";
            let secondPartMessage = "ворон";
            let lastTwoDigits = crowsCount % 100;

            if (lastTwoDigits >= 11 && lastTwoDigits <= 14) {
                secondPartMessage = "ворон";
            }
            else {
                switch (crowsCount % 10) {
                    case 1:
                        secondPartMessage = "ворона";
                        break;
                    case 2:
                    case 3:
                    case 4:
                        secondPartMessage = "вороны";
                        break;
                    default:
                        secondPartMessage = "ворон";
                }
            }
            result = `${firstPartMessage} ${crowsCount} ${secondPartMessage}.`;
        }
        
        console.log(result);
        document.write(result);
    </script>
</body>

</html>
